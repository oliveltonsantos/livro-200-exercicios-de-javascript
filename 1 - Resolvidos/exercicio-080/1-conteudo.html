<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica de programação</title>
    <link rel="stylesheet" href="3-estilo.css">
</head>

<body>
    <section class="design-section">

        <h1>Calculadora de média de notas</h1>

        <p>Digite as notas do aluno em cada matéria:</p>

        <p>Nome: <input type="text" name="nome" id="nome"></p>

        <p>Português: <input type="number" name="portugues" id="portugues" class="todasMaterias"></p>

        <p>Matemática: <input type="number" name="matematica" id="matematica" class="todasMaterias"></p>

        <p>Biologia: <input type="number" name="biologia" id="biologia" class="todasMaterias"></p>

        <p>Filosofia: <input type="number" name="filosofia" id="filosofia" class="todasMaterias"></p>

        <button onclick="processarNotas()" class="btnProcessarNotas">Calcular</button>

        <button onclick="novoCalculo()" class="btnNovoCalculo">Novo cálculo</button>

        <div class="mensagem"></div>

    </section>

    <script src="./2-codigo.js"></script>

</body>

</html>
