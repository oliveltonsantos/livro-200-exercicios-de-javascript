<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica de programação</title>
    <link rel="stylesheet" href="3-estilo.css">
</head>

<body>
    <section class="design-section">

        <h1>Diário do meu Pet</h1>

        <p>Seja bem-vindo(a) ao PetDiary!</p>

        <p>Cadastre as informações do seu pet abaixo:</p>

        <p>Nome: <input type="text" name="nome" id="nome"></p>

        <p>Raça: <input type="text" name="raca" id="raca"></p>

        <p>Idade: <input type="number" name="idade" id="idade"></p>

        <button onclick="cadastrarPet()" class="btnCadastrarPet">Cadastrar meu pet</button>

        <button onclick="cadastrarNovoPet()" class="btnCadastrarNovoPet">Novo pet</button>

        <div class="mensagem"></div>

    </section>

    <script src="./2-codigo.js"></script>

</body>

</html>
