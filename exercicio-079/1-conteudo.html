<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica de programação</title>
    <link rel="stylesheet" href="3-estilo.css">
</head>

<body>
    <section class="design-section">

        <h1>Cadastro de carros</h1>

        <p>Informe os dados sobre o carro abaixo.</p>

        <p>Marca: <input type="text" name="marca" id="marca"></p>

        <p>Modelo: <input type="text" name="modelo" id="modelo"></p>

        <p>Ano: <input type="number" name="ano" id="ano"></p>

        <p>Velocidade inicial: <input type="number" name="velocidade" id="velocidade"></p>

        <button onclick="cadastrarCarro()" class="btnCadastrarCarro">Cadastrar carro</button>

        <button onclick="novoCadastro()" class="btnNovoCadastro">Novo carro</button>

        <div class="mensagem"></div>

    </section>

    <script src="./2-codigo.js"></script>

</body>
