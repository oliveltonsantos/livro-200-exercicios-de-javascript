<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica de programação</title>
    <link rel="stylesheet" href="3-estilo.css">
</head>

<body>
    <section class="design-section">

        <h1>Cadastro de calçados</h1>

        <p class="esconderElementos">Informe os seguintes dados do calçado:</p>

        <p class="esconderElementos">Modelo / Marca: <input type="text" name="modelo" id="modelo"></p>

        <p class="esconderElementos">Cor: <input type="text" name="cor" id="cor"></p>

        <p class="esconderElementos">Tamanho: <input type="number" name="tamanho" id="tamanho"></p>

        <button onclick="processarDados()" class="esconderElementos">Cadastrar</button>

        <div class="mensagem"></div>

        <button onclick="novoCadastro()" class="btnNovoCadastro">Novo cadastro</button>

    </section>

    <script src="./2-codigo.js"></script>

</body>

</html>
