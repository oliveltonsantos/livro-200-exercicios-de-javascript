<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica de programação</title>
    <link rel="stylesheet" href="3-estilo.css">
</head>

<body>
    <section class="design-section">

        <h1>Cadastro de pacientes</h1>

        <p class="esconderElementos">Informe as seguintes informações abaixo:</p>

        <p class="esconderElementos">Nome: <input type="text" name="nome" id="nome"></p>

        <p class="esconderElementos">Idade: <input type="number" name="idade" id="idade"></p>

        <p class="esconderElementos">Profissão: <input type="text" name="profissao" id="profissao"></p>

        <p class="esconderElementos">Altura: <input type="number" name="altura" id="altura"></p>

        <p class="esconderElementos">Peso: <input type="number" name="peso" id="peso"></p>

        <button onclick="processarDados()" class="esconderElementos">Cadastrar paciente</button>

        <div class="mensagem"></div>

        <button onclick="novoCadastro()" class="btnNovoCadastro">Novo cadastro</button>

    </section>

    <script src="./2-codigo.js"></script>

</body>

</html>
